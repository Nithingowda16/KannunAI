name: KannunAI Master CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Build, Typecheck, Lint, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Strict TypeScript Compilation Check
        run: npm run typecheck

      - name: ESLint Code Quality Gate
        run: npm run lint

      - name: Run Vitest Unit, Security, Accessibility & API Integration Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Real Browser E2E & axe-core Accessibility Audits
        run: npm run test:e2e:playwright

      - name: Build Production Bundle
        run: npm run build
